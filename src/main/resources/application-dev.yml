spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/seatvault
    username: seatvault
    password: seatvault

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: change-me-in-prod-this-is-a-dev-only-secret-key-0123456789
    expiration-minutes: 60
  cors:
    allowed-origins: "*"
  booking:
    redis-lock-enabled: false
