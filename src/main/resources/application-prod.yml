spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Strictly require env injection in production
    # Either a full JDBC URL in DB_URL, or the parts (what Render's managed
    # PostgreSQL provides): DB_HOST, DB_PORT, DB_NAME.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

app:
  jwt:
    # Strictly require injected secrets in production, no defaults
    secret: ${JWT_SECRET}
    expiration-minutes: 15
    refresh-expiration-days: 7
  cors:
    # The UI is served by the app itself, so its own public URL is the one origin needed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL}}
  ticket:
    # Strictly require an injected secret in production, no default.
    hmac-secret: ${TICKET_HMAC_SECRET}
  booking:
    redis-lock-enabled: true
    rate-limit:
      enabled: true
      max-requests: 10
      window-seconds: 60
