spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Strictly require env injection in production
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

app:
  jwt:
    # Strictly require injected secrets in production, no defaults
    secret: ${JWT_SECRET}
    expiration-minutes: 15
    refresh-expiration-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ticket:
    # Strictly require an injected secret in production, no default.
    hmac-secret: ${TICKET_HMAC_SECRET}
  booking:
    redis-lock-enabled: true
    rate-limit:
      enabled: true
      max-requests: 10
      window-seconds: 60
